  <!-- Typography for light mode -->
  <text x="64" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Paper<tspan fill="#D97706">Fox</tspan></text>
