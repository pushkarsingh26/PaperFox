      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="foxForehead" x1="50" y1="30" x2="50" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
