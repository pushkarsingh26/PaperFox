    <polygon points="18,14 10,56 34,48" fill="url(#foxCheekL)" stroke="#B45309" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="82,14 90,56 66,48" fill="url(#foxCheekR)" stroke="#92400E" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="50,30 18,14 34,48" fill="url(#foxEarL)" stroke="#B45309" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="50,30 82,14 66,48" fill="url(#foxEarR)" stroke="#92400E" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="34,48 10,56 50,88" fill="url(#foxJawL)" stroke="#F59E0B" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="66,48 90,56 50,88" fill="url(#foxJawR)" stroke="#D97706" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="50,30 34,48 50,62 66,48" fill="url(#foxForehead)" stroke="#D97706" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="34,48 50,62 50,88" fill="url(#foxSnoutL)" stroke="#B45309" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="66,48 50,62 50,88" fill="url(#foxSnoutR)" stroke="#92400E" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="46,84 54,84 50,88" fill="#1E293B"/>
