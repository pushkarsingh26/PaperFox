<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="foxEarL" x1="18" y1="14" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="foxEarR" x1="82" y1="14" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="foxCheekL" x1="10" y1="14" x2="34" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="foxCheekR" x1="90" y1="14" x2="66" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="foxForehead" x1="50" y1="30" x2="50" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="foxJawL" x1="10" y1="56" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="foxJawR" x1="90" y1="56" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="foxSnoutL" x1="34" y1="48" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="foxSnoutR" x1="66" y1="48" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Left Outer Cheek -->
    <polygon points="18,14 10,56 34,48" fill="url(#foxCheekL)" stroke="#B45309" stroke-width="0.75" stroke-linejoin="round"/>
    <!-- Right Outer Cheek -->
    <polygon points="82,14 90,56 66,48" fill="url(#foxCheekR)" stroke="#92400E" stroke-width="0.75" stroke-linejoin="round"/>
    
    <!-- Left Ear -->
    <polygon points="50,30 18,14 34,48" fill="url(#foxEarL)" stroke="#B45309" stroke-width="0.75" stroke-linejoin="round"/>
    <!-- Right Ear -->
    <polygon points="50,30 82,14 66,48" fill="url(#foxEarR)" stroke="#92400E" stroke-width="0.75" stroke-linejoin="round"/>
    
    <!-- Left Jaw (Cream fur) -->
    <polygon points="34,48 10,56 50,88" fill="url(#foxJawL)" stroke="#F59E0B" stroke-width="0.75" stroke-linejoin="round"/>
    <!-- Right Jaw (Warm cream shadow) -->
    <polygon points="66,48 90,56 50,88" fill="url(#foxJawR)" stroke="#D97706" stroke-width="0.75" stroke-linejoin="round"/>
    
    <!-- Forehead Center Diamond -->
    <polygon points="50,30 34,48 50,62 66,48" fill="url(#foxForehead)" stroke="#D97706" stroke-width="0.75" stroke-linejoin="round"/>
    
    <!-- Snout Bridge Left -->
    <polygon points="34,48 50,62 50,88" fill="url(#foxSnoutL)" stroke="#B45309" stroke-width="0.75" stroke-linejoin="round"/>
    <!-- Snout Bridge Right -->
    <polygon points="66,48 50,62 50,88" fill="url(#foxSnoutR)" stroke="#92400E" stroke-width="0.75" stroke-linejoin="round"/>
    
    <!-- Nose Tip -->
    <polygon points="46,84 54,84 50,88" fill="#1E293B"/>
  </g>
</svg>
